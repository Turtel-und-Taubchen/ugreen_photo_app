services:
  photocurator:
    image: ${PC_IMAGE:-photocurator:latest}
    container_name: photocurator
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8470}:8080"
    environment:
      TZ: ${TZ}
      PC_NOMINATIM_CONTACT: ${NOMINATIM_CONTACT}
      PC_PHOTOS_HOST_PATH: ${PHOTOS_PATH}
      PC_PRESERVE_MTIME: "true"
    volumes:
      - ${PHOTOS_PATH}:/photos
      - ${DATA_PATH}:/data
      - ${BACKUP_PATH}:/backup
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "/app/photocurator", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
