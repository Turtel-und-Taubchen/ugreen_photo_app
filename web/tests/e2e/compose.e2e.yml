# Overlay on deploy/docker-compose.yml for the e2e run; everything else (hardening,
# read-only root, tmpfs, mounts, ports) comes from the production file via the
# interpolation values in compose.ts.
services:
  photocurator:
    image: photocurator:dev
    # Distinct from the production name so a local instance never blocks the e2e run.
    container_name: photocurator-e2e
    healthcheck:
      interval: 2s
      start_period: 5s
    # Outside /data so it never collides with the writable data bind mount.
    volumes:
      - type: bind
        source: ${PC_E2E_USERS_FILE}
        target: /run/users.conf
        read_only: true
    environment:
      PC_USERS_FILE: /run/users.conf
      # No settle time: e2e files are written once and must be indexed by the first scan.
      PC_SCAN_QUIET: "0s"
