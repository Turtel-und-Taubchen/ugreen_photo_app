# Overlay on deploy/docker-compose.yml for the e2e run; everything else (hardening,
# read-only root, tmpfs, mounts, ports) comes from the production file via the
# interpolation values in compose.ts.
services:
  photocurator:
    image: photocurator:dev
    # Distinct from the production name so a local instance never blocks the e2e run.
    container_name: photocurator-e2e
    healthcheck:
      interval: 2s
      start_period: 5s
